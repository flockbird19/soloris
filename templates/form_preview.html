{% extends "print_base.html" %}
{% block title %}GriefOS | Form Preview{% endblock %}

{% block content %}
<h2 class="print-header">{{ form['Form Name'] }}</h2>

{% for key, value in form.items() %}
    {% if key != 'Form Name' %}
    <div class="print-field">
        <label class="print-label">{{ key }}</label>
        <div class="print-value">{{ value }}</div>
    </div>
    {% endif %}
{% endfor %}

<div class="print-actions no-print">
    <button onclick="window.print()" class="primary-btn flex-1">Print & Sign</button>
    <a href="/" class="muted back-link">Back</a>
</div>
{% endblock %}
